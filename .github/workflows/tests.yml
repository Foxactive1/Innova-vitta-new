name: Tests
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DEBUG: "true"
        run: pytest -q --cov=core.time_utils --cov-report=term-missing
