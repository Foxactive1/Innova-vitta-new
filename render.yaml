services:
  - type: web
    name: innova-vitta-plus
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: innova-vitta-db
          property: connectionString
      - key: DEBUG
        value: "False"

databases:
  - name: innova-vitta-db
    databaseName: innova_vitta
    user: innova_admin
