{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow-sm">

        <!-- ==================================================
             CABEÇALHO
        =================================================== -->

        <div class="card-header bg-success text-white">

          <h4 class="mb-0">
            <i class="bi bi-calendar-plus me-2"></i>
            Agendar Nova Consulta
          </h4>

        </div>


        <!-- ==================================================
             FORMULÁRIO
        =================================================== -->

        <div class="card-body">

          <form
            method="post"
            action="{{ url_for('consultas.nova_consulta') }}"
            id="formConsulta"
          >

            <div class="row g-3">


              <!-- ==================================================
                   PACIENTE
              =================================================== -->

              <div class="col-md-12">

                <label class="form-label">
                  Paciente *
                </label>

                <select
                  class="form-select"
                  name="paciente_id"
                  id="pacienteSelect"
                  required
                >

                  <option value="">
                    Selecione o paciente
                  </option>

                  {% for p in pacientes %}

                  <option value="{{ p.id }}">

                    {{ p.nome }}

                    {% if p.telefone %}
                      ({{ p.telefone }})
                    {% else %}
                      (sem tel)
                    {% endif %}

                  </option>

                  {% endfor %}

                </select>

              </div>


              <!-- ==================================================
                   MÉDICO
              =================================================== -->

              <div class="col-md-12">

                <label class="form-label">
                  Médico *
                </label>

                <select
                  class="form-select"
                  name="medico_id"
                  id="medicoSelect"
                  required
                >

                  <option value="">
                    Selecione o médico
                  </option>

                  {% for m in medicos %}

                  <option value="{{ m.id }}">

                    {{ m.nome }}

                    —
                    {{ m.especialidade or 'Sem especialidade' }}

                  </option>

                  {% endfor %}

                </select>

              </div>


              <!-- ==================================================
                   SERVIÇO
              =================================================== -->

              <div class="col-md-8">

                <label class="form-label">
                  Serviço *
                </label>

                <select
                  class="form-select"
                  name="servico_id"
                  id="servicoSelect"
                  required
                >

                  <option value="">
                    Selecione o serviço
                  </option>

                  {% for s in servicos %}

                  <option
                    value="{{ s.id }}"
                    data-valor="{{ s.valor }}"
                  >

                    {{ s.nome }}

                    — R$
                    {{ "%.2f"|format(s.valor|float)|replace('.', ',') }}

                  </option>

                  {% endfor %}

                </select>

                {% if not servicos %}

                <div class="alert alert-warning mt-2 mb-0">

                  <i class="bi bi-exclamation-triangle me-1"></i>

                  Nenhum serviço de consulta está cadastrado.

                  <a
                    href="/servicos/"
                    class="alert-link"
                  >
                    Cadastrar serviço
                  </a>

                </div>

                {% endif %}

              </div>


              <!-- ==================================================
                   VALOR
              =================================================== -->

              <div class="col-md-4">

                <label class="form-label">
                  Valor da consulta
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    R$
                  </span>

                  <input
                    type="text"
                    class="form-control fw-bold"
                    id="valorServico"
                    value="0,00"
                    readonly
                  >

                </div>

                <small class="text-muted">
                  Valor definido pelo serviço
                </small>

              </div>


              <!-- ==================================================
                   DATA
              =================================================== -->

              <div class="col-md-6">

                <label class="form-label">
                  Data *
                </label>

                <input
                  type="date"
                  class="form-control"
                  name="data"
                  id="dataConsulta"
                  required
                  min="{{ hoje }}"
                >

              </div>


              <!-- ==================================================
                   HORA
              =================================================== -->

              <div class="col-md-6">

                <label class="form-label">
                  Hora *
                </label>

                <select
                  class="form-select"
                  name="hora"
                  id="horaSelect"
                  required
                >

                  <option value="">
                    Selecione a data e médico primeiro
                  </option>

                </select>

              </div>


              <!-- ==================================================
                   TIPO
              =================================================== -->

              <div class="col-md-6">

                <label class="form-label">
                  Tipo
                </label>

                <select
                  class="form-select"
                  name="tipo"
                >

                  <option value="normal">
                    Normal
                  </option>

                  <option value="retorno">
                    Retorno
                  </option>

                  <option value="emergencia">
                    Emergência
                  </option>

                </select>

              </div>


              <!-- ==================================================
                   MOTIVO
              =================================================== -->

              <div class="col-md-6">

                <label class="form-label">
                  Motivo
                </label>

                <input
                  type="text"
                  class="form-control"
                  name="motivo"
                  placeholder="Motivo da consulta"
                  maxlength="500"
                >

              </div>

            </div>


            <!-- ==================================================
                 RESUMO
            =================================================== -->

            <div
              class="alert alert-light border mt-4"
              id="resumoConsulta"
              style="display:none;"
            >

              <div class="d-flex justify-content-between align-items-center">

                <div>

                  <strong>
                    <i class="bi bi-receipt me-1"></i>
                    Resumo
                  </strong>

                  <div
                    class="small text-muted"
                    id="resumoServico"
                  ></div>

                </div>

                <div class="text-end">

                  <small class="text-muted">
                    Valor
                  </small>

                  <div
                    class="fs-5 fw-bold text-success"
                    id="resumoValor"
                  >
                    R$ 0,00
                  </div>

                </div>

              </div>

            </div>


            <!-- ==================================================
                 BOTÕES
            =================================================== -->

            <div class="d-flex justify-content-between mt-4">

              <a
                href="{{ url_for('consultas.listar_consultas') }}"
                class="btn btn-outline-secondary"
              >

                <i class="bi bi-arrow-left me-1"></i>

                Voltar

              </a>


              <button
                type="submit"
                class="btn btn-success"
                id="btnAgendar"
              >

                <i class="bi bi-check-lg me-1"></i>

                Agendar Consulta

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* ============================================================
   ELEMENTOS
============================================================ */

const medicoSelect = document.getElementById('medicoSelect');
const dataConsulta = document.getElementById('dataConsulta');
const horaSelect = document.getElementById('horaSelect');

const servicoSelect = document.getElementById('servicoSelect');
const valorServico = document.getElementById('valorServico');

const resumoConsulta = document.getElementById('resumoConsulta');
const resumoServico = document.getElementById('resumoServico');
const resumoValor = document.getElementById('resumoValor');

const formConsulta = document.getElementById('formConsulta');
const btnAgendar = document.getElementById('btnAgendar');


/* ============================================================
   FORMATA VALOR
============================================================ */

function formatarValor(valor) {

  const numero = parseFloat(valor || 0);

  return numero.toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

}


/* ============================================================
   SERVIÇO
============================================================ */

servicoSelect.addEventListener('change', function () {

  const option =
    this.options[this.selectedIndex];

  if (!this.value) {

    valorServico.value = '0,00';

    resumoConsulta.style.display = 'none';

    return;

  }

  const valor =
    parseFloat(
      option.dataset.valor || 0
    );

  const valorFormatado =
    formatarValor(valor);

  valorServico.value =
    valorFormatado;

  resumoServico.textContent =
    option.textContent.trim();

  resumoValor.textContent =
    `R$ ${valorFormatado}`;

  resumoConsulta.style.display =
    'block';

});


/* ============================================================
   HORÁRIOS
============================================================ */

medicoSelect.addEventListener(
  'change',
  carregarHorarios
);

dataConsulta.addEventListener(
  'change',
  carregarHorarios
);


function carregarHorarios() {

  const medicoId =
    medicoSelect.value;

  const data =
    dataConsulta.value;


  if (!medicoId || !data) {

    horaSelect.innerHTML = `
      <option value="">
        Selecione a data e médico primeiro
      </option>
    `;

    return;

  }


  horaSelect.innerHTML = `
    <option value="">
      Carregando horários...
    </option>
  `;


  fetch(
    `/api/horarios-disponiveis?medico_id=${encodeURIComponent(medicoId)}&data=${encodeURIComponent(data)}`
  )

    .then(response => {

      if (!response.ok) {

        throw new Error(
          'Erro na resposta do servidor'
        );

      }

      return response.json();

    })

    .then(data => {

      horaSelect.innerHTML = '';


      if (
        data.disponiveis &&
        data.disponiveis.length > 0
      ) {

        const primeira =
          document.createElement('option');

        primeira.value = '';

        primeira.textContent =
          'Selecione o horário';

        horaSelect.appendChild(
          primeira
        );


        data.disponiveis.forEach(hora => {

          const option =
            document.createElement('option');

          option.value = hora;

          option.textContent = hora;

          horaSelect.appendChild(
            option
          );

        });

      } else {

        const option =
          document.createElement('option');

        option.value = '';

        option.textContent =
          'Nenhum horário disponível';

        horaSelect.appendChild(
          option
        );

      }

    })

    .catch(error => {

      console.error(
        'Erro ao carregar horários:',
        error
      );

      horaSelect.innerHTML = `
        <option value="">
          Erro ao carregar horários
        </option>
      `;

    });

}


/* ============================================================
   PROTEÇÃO NO ENVIO
============================================================ */

formConsulta.addEventListener(
  'submit',
  function(event) {

    if (!servicoSelect.value) {

      event.preventDefault();

      alert(
        'Selecione o serviço da consulta.'
      );

      servicoSelect.focus();

      return;

    }


    if (!horaSelect.value) {

      event.preventDefault();

      alert(
        'Selecione um horário disponível.'
      );

      horaSelect.focus();

      return;

    }


    btnAgendar.disabled = true;

    btnAgendar.innerHTML = `
      <span
        class="spinner-border spinner-border-sm me-1"
      ></span>

      Agendando...
    `;

  }
);

</script>

{% endblock %}
