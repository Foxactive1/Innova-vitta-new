{% extends "base.html" %}

{% block title %}Login | InNova Vitta+{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-shield-lock fs-1 text-primary"></i>
            <h1 class="h4 mt-2 mb-1">Acesso seguro</h1>
            <p class="text-muted mb-0">InNova Vitta+</p>
          </div>

          <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label class="form-label" for="username">Usuário</label>
              <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Senha</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">
              <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
