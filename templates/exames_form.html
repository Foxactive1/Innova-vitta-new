{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0"><i class="bi bi-clipboard2-plus me-2"></i>Agendar Novo Exame</h4>
        </div>
        <div class="card-body">
          <form method="post" action="/exames/novo">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label">Paciente *</label>
                <select class="form-select" name="paciente_id" required>
                  <option value="">Selecione o paciente</option>
                  {% for p in pacientes %}
                  <option value="{{ p.id }}">{{ p.nome }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Médico Solicitante</label>
                <select class="form-select" name="medico_id">
                  <option value="">—</option>
                  {% for m in medicos %}
                  <option value="{{ m.id }}">{{ m.nome }} — {{ m.especialidade or 'Sem especialidade' }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Tipo de Exame *</label>
                <select class="form-select" name="tipo" required>
                  <option value="">Selecione</option>
                  <option value="Sangue">Sangue</option>
                  <option value="Urina">Urina</option>
                  <option value="Raio-X">Raio-X</option>
                  <option value="Ultrassom">Ultrassom</option>
                  <option value="Eletrocardiograma">Eletrocardiograma</option>
                  <option value="Tomografia">Tomografia</option>
                  <option value="Ressonância">Ressonância</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Serviço</label>
                <select class="form-select" name="servico_id">
                  <option value="">Selecione um serviço</option>
                  {% for s in servicos %}
                  <option value="{{ s.id }}">{{ s.nome }} – R$ {{ "%.2f"|format(s.valor|float) }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Data</label>
                <input type="date" class="form-control" name="data" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Hora</label>
                <input type="time" class="form-control" name="hora" required>
              </div>
              <div class="col-md-12">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" name="descricao" rows="2" placeholder="Detalhes do exame..."></textarea>
              </div>
            </div>
            <div class="d-flex justify-content-between mt-4">
              <a href="/exames/" class="btn btn-outline-secondary">Voltar</a>
              <button type="submit" class="btn btn-info text-white">
                <i class="bi bi-check-lg me-1"></i>Agendar Exame
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
